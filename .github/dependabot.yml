version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine churn; majors come separately so they get read.
      minor-and-patch:
        update-types: ['minor', 'patch']
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['dependencies', 'ci']
