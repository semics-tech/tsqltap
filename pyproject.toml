[project]
name = "tsqltap"
version = "0.1.1"
description = "pgTAP-style testing for SQL Server: T-SQL assertions, a pytest runner, disposable containers"
authors = [{ name = "Oliver Breeden" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["sql server", "mssql", "t-sql", "testing", "pytest", "pgtap", "tsqlt", "testcontainers", "dacpac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "mssql-python>=1.15.0",
    "pytest>=9",
    "pyyaml>=6.0.3",
    "testcontainers[mssql]>=4.15.0",
]

[project.optional-dependencies]
snapshot = ["syrupy>=4.9"]

[project.urls]
Homepage = "https://github.com/semics-tech/tsqltap"
Issues = "https://github.com/semics-tech/tsqltap/issues"
Changelog = "https://github.com/semics-tech/tsqltap/blob/main/CHANGELOG.md"

[project.scripts]
tsqltap = "tsqltap.cli:main"

[project.entry-points.pytest11]
tsqltap = "tsqltap.plugin"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-p", "pytester"]

# The framework's own tests run against small databases built from SQL scripts (no dacpac).
[tool.tsqltap]
image = "mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04"
setup = ["tests/fixture_db/server/*.sql"]   # server-level, before any database

[[tool.tsqltap.databases]]
name = "TsqltapSelf"
scripts = ["tests/fixture_db/*.sql"]
seed = ["tests/fixture_db/baseline/*.csv"]
finalize = ["tests/fixture_db/finalize/*.sql"]

[[tool.tsqltap.databases]]
name = "TsqltapOther"
tests = ["tests/sql/other"]       # files under here default to this database

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501", "PTH207"]  # glob.glob: config patterns are root-relative strings with **

[tool.mypy]
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
    "syrupy>=6.1.1",
    "types-pyyaml>=6.0.12.20260906",
]
